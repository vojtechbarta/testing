# Deploys to Azure App Service (zip). If your API runs on Azure Container Apps, use azure/deploy.sh
# or a pipeline that builds backend/Dockerfile and updates the Container App instead.
name: Deploy backend to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "azure/**"
      - ".github/workflows/azure-backend.yml"
  workflow_dispatch:

jobs:
  deploy-containerapp:
    # Enable this job with repository variable AZURE_USE_CONTAINERAPP_DEPLOY=true.
    if: ${{ vars.AZURE_USE_CONTAINERAPP_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps via deploy.sh
        env:
          AZURE_API_HOSTING: containerapp
          AZURE_RG: ${{ vars.AZURE_RG }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SWA_LOCATION: ${{ vars.AZURE_SWA_LOCATION }}
          AZURE_EXISTING_CONTAINER_ENV_ID: ${{ vars.AZURE_EXISTING_CONTAINER_ENV_ID }}
          AZURE_PREBUILT_API_IMAGE: ${{ vars.AZURE_PREBUILT_API_IMAGE }}
          MYSQL_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          DEV_CLIENT_IP: ${{ vars.DEV_CLIENT_IP }}
        run: |
          chmod +x azure/deploy.sh
          ./azure/deploy.sh "${{ vars.AZURE_BASE_NAME }}"

  build-and-deploy:
    # GitHub does not allow `secrets` in job-level `if`. Set repo variable AZURE_USE_APP_SERVICE_DEPLOY=true
    # when you use App Service with AZURE_WEBAPP_PUBLISH_PROFILE + AZURE_WEBAPP_NAME.
    if: ${{ vars.AZURE_USE_APP_SERVICE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install, build, production dependencies
        working-directory: backend
        run: |
          npm ci
          npm run build
          npx prisma generate
          npm prune --omit=dev

      - name: Create deployment package
        run: (cd backend && zip -qr ../backend-deploy.zip .)

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-deploy.zip
