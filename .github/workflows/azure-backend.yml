# Deploys to Azure App Service (zip). If your API runs on Azure Container Apps, use azure/deploy.sh
# or a pipeline that builds backend/Dockerfile and updates the Container App instead.
name: Deploy backend to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "azure/**"
      - ".github/workflows/azure-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps
        env:
          AZURE_API_HOSTING: containerapp
          AZURE_RG: ${{ vars.AZURE_RG }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SWA_LOCATION: ${{ vars.AZURE_SWA_LOCATION }}
          AZURE_EXISTING_CONTAINER_ENV_ID: ${{ vars.AZURE_EXISTING_CONTAINER_ENV_ID }}
          MYSQL_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          DEV_CLIENT_IP: ${{ vars.DEV_CLIENT_IP }}
        run: |
          chmod +x azure/deploy.sh
          ./azure/deploy.sh "${{ vars.AZURE_BASE_NAME }}"

      - name: Post-deploy smoke checks
        run: |
          set -euo pipefail
          if [[ -z "${API_URL:-}" ]]; then
            echo "API_URL is empty after deploy." >&2
            exit 1
          fi

          retry_http_get() {
            local url="$1"
            local output="$2"
            local attempts="${3:-30}"
            local sleep_seconds="${4:-10}"
            local i
            for ((i=1; i<=attempts; i+=1)); do
              if curl -fsS --connect-timeout 5 --max-time 20 "$url" -o "$output"; then
                echo "[$(date -u +%H:%M:%S)] GET ok: $url (attempt $i/$attempts)"
                return 0
              fi
              echo "[$(date -u +%H:%M:%S)] GET not ready: $url (attempt $i/$attempts), waiting ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            done
            echo "[$(date -u +%H:%M:%S)] GET failed after ${attempts} attempts: $url" >&2
            return 1
          }

          print_containerapp_diagnostics() {
            if [[ -z "${AZURE_RESOURCE_GROUP:-}" || -z "${CONTAINER_APP_NAME:-}" ]]; then
              echo "Container App diagnostics skipped (AZURE_RESOURCE_GROUP/CONTAINER_APP_NAME missing)."
              return 0
            fi
            echo "=== Container App diagnostics (${AZURE_RESOURCE_GROUP}/${CONTAINER_APP_NAME}) ==="
            az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
              --query "{name:name,fqdn:properties.configuration.ingress.fqdn,provisioningState:properties.provisioningState,runningStatus:properties.runningStatus}" -o json || true
            az containerapp revision list -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" \
              --query "[].{name:name,active:properties.active,created:properties.createdTime,runningState:properties.runningState,health:properties.healthState,replicas:properties.replicas}" -o table || true
            az containerapp logs show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_NAME" --tail 120 || true
          }

          echo "Smoke: $API_URL/health"
          if ! retry_http_get "$API_URL/health" /tmp/health.json 18 10; then
            print_containerapp_diagnostics
            echo "Health endpoint stayed unavailable after retry window." >&2
            exit 1
          fi
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          echo "Smoke: $API_URL/exchange-rates"
          retry_http_get "$API_URL/exchange-rates" /tmp/exchange-rates.json 18 5
          cat /tmp/exchange-rates.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/exchange-rates.json","utf8")); if(!Array.isArray(d)){throw new Error("/exchange-rates must return an array")}'

          echo "Smoke: $API_URL/products?lang=en&sort=name-asc"
          retry_http_get "$API_URL/products?lang=en&sort=name-asc" /tmp/products.json 18 5
          cat /tmp/products.json
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/products.json","utf8")); if(!d || !Array.isArray(d.products) || !d.priceBounds || typeof d.priceBounds.min!=="number" || typeof d.priceBounds.max!=="number" || typeof d.priceBounds.currencyCode!=="string"){throw new Error("/products response shape mismatch: expected {products, priceBounds}")}'

          if [[ -n "${STATIC_WEB_APP_URL:-}" ]]; then
            ORIGIN="${STATIC_WEB_APP_URL%/}"
            echo "Smoke: CORS preflight from $ORIGIN"
            curl -isS -X OPTIONS "$API_URL/health" \
              -H "Origin: $ORIGIN" \
              -H "Access-Control-Request-Method: GET" | tee /tmp/cors.txt >/dev/null
            grep -qi "^access-control-allow-origin: ${ORIGIN}$" /tmp/cors.txt
          else
            echo "Skipping CORS smoke: STATIC_WEB_APP_URL unavailable"
          fi
